<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Dark Avionics Panel Background -->
    <linearGradient id="cockpitBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0c0e" />
      <stop offset="50%" stop-color="#111418" />
      <stop offset="100%" stop-color="#07080a" />
    </linearGradient>

    <!-- CRT Phosphor & Ember Glow -->
    <filter id="hudGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Cockpit Glass Raster / Grid -->
    <pattern id="hudGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#22d3ee" stroke-opacity="0.02" stroke-width="1" />
    </pattern>
  </defs>

  <style>
    .mono { font-family: 'JetBrains Mono', 'Fira Code', 'SF Mono', Consolas, monospace; }
    .stencil { font-family: 'JetBrains Mono', 'Impact', -apple-system, monospace; font-weight: 800; }
  </style>

  <!-- Cockpit Glass & Base Panel -->
  <rect width="1200" height="360" fill="url(#cockpitBg)" rx="8" />
  <rect width="1200" height="360" fill="url(#hudGrid)" rx="8" />

  <!-- Outer HUD Glass Frame / Bezel Border -->
  <rect x="20" y="20" width="1160" height="320" rx="4" fill="none" stroke="#1e293b" stroke-width="1.5" />

  <!-- Tactical Corner HUD Brackets -->
  <path d="M 20 60 L 20 20 L 60 20" fill="none" stroke="#f97316" stroke-width="3" />
  <path d="M 1140 20 L 1180 20 L 1180 60" fill="none" stroke="#f97316" stroke-width="3" />
  <path d="M 20 300 L 20 340 L 60 340" fill="none" stroke="#f97316" stroke-width="3" />
  <path d="M 1140 340 L 1180 340 L 1180 300" fill="none" stroke="#f97316" stroke-width="3" />

  <!-- Left: Airspeed Indicator Tape (F-14 Avionics Style) -->
  <g transform="translate(70, 95)" stroke="#38bdf8" stroke-width="1.5" opacity="0.75">
    <line x1="0" y1="0" x2="0" y2="160" />
    <!-- Speed Ticks -->
    <line x1="0" y1="10" x2="16" y2="10" />
    <line x1="0" y1="45" x2="10" y2="45" />
    <line x1="0" y1="80" x2="20" y2="80" stroke="#f97316" stroke-width="2" />
    <line x1="0" y1="115" x2="10" y2="115" />
    <line x1="0" y1="150" x2="16" y2="150" />
    <text x="28" y="84" fill="#f97316" class="mono" font-size="12" font-weight="700">M 1.2</text>
    <text x="24" y="15" fill="#38bdf8" class="mono" font-size="10">450</text>
    <text x="24" y="155" fill="#38bdf8" class="mono" font-size="10">320</text>
    <text x="-5" y="-14" fill="#64748b" class="mono" font-size="9" letter-spacing="1">IAS // KT</text>
  </g>

  <!-- Right: Radar Altimeter Tape & Vertical Velocity -->
  <g transform="translate(1110, 95)" stroke="#38bdf8" stroke-width="1.5" opacity="0.75" text-anchor="end">
    <line x1="0" y1="0" x2="0" y2="160" />
    <!-- Alt Ticks -->
    <line x1="0" y1="10" x2="-16" y2="10" />
    <line x1="0" y1="45" x2="-10" y2="45" />
    <line x1="0" y1="80" x2="-20" y2="80" stroke="#f97316" stroke-width="2" />
    <line x1="0" y1="115" x2="-10" y2="115" />
    <line x1="0" y1="150" x2="-16" y2="150" />
    <text x="-28" y="84" fill="#f97316" class="mono" font-size="12" font-weight="700">18,500</text>
    <text x="-24" y="15" fill="#38bdf8" class="mono" font-size="10">21.0K</text>
    <text x="-24" y="155" fill="#38bdf8" class="mono" font-size="10">16.0K</text>
    <text x="5" y="-14" fill="#64748b" class="mono" font-size="9" letter-spacing="1">ALT // BARO</text>
  </g>

  <!-- Top Avionics Header Data -->
  <g class="mono" font-size="10" letter-spacing="2">
    <text x="50" y="44" fill="#64748b">TACAN: CH-72 [LINCOLN] // CVN-72</text>
    <text x="600" y="44" fill="#38bdf8" text-anchor="middle" opacity="0.8">HDG 045° • BRC 210° • AWG-9 RADAR: STBY</text>
    <text x="1150" y="44" fill="#f97316" text-anchor="end" filter="url(#hudGlow)">MASTER CAUTION: CLEAR</text>
  </g>

  <!-- Central Tomcat HUD Symbology -->
  <g transform="translate(600, 175)">
    <!-- Pitch Ladder / Horizon Bars -->
    <g stroke="#38bdf8" stroke-width="1.5" opacity="0.35">
      <!-- +5 Deg Pitch -->
      <line x1="-120" y1="-55" x2="-50" y2="-55" />
      <line x1="-120" y1="-55" x2="-120" y2="-45" />
      <line x1="50" y1="-55" x2="120" y2="-55" />
      <line x1="120" y1="-55" x2="120" y2="-45" />

      <!-- -5 Deg Pitch (Dashed) -->
      <line x1="-120" y1="65" x2="-50" y2="65" stroke-dasharray="8 6" />
      <line x1="-120" y1="65" x2="-120" y2="55" />
      <line x1="50" y1="65" x2="120" y2="65" stroke-dasharray="8 6" />
      <line x1="120" y1="65" x2="120" y2="55" />
    </g>

    <!-- Radar Target Reticle / Anvil-Aligned Crosshairs -->
    <circle cx="0" cy="5" r="95" fill="none" stroke="#1e293b" stroke-width="1.5" />
    <circle cx="0" cy="5" r="105" fill="none" stroke="#f97316" stroke-opacity="0.4" stroke-width="1.5" stroke-dasharray="10 14" />

    <!-- Central Reticle Pip -->
    <circle cx="0" cy="5" r="3" fill="#f97316" filter="url(#hudGlow)" />
    <line x1="-20" y1="5" x2="-8" y2="5" stroke="#f97316" stroke-width="1.5" />
    <line x1="8" y1="5" x2="20" y2="5" stroke="#f97316" stroke-width="1.5" />
    <line x1="0" y1="-15" x2="0" y2="-3" stroke="#f97316" stroke-width="1.5" />
    <line x1="0" y1="13" x2="0" y2="25" stroke="#f97316" stroke-width="1.5" />

    <!-- Main Branding Title -->
    <text x="0" y="16" fill="#f8fafc" class="stencil" font-size="58" letter-spacing="10" text-anchor="middle">
      FORGE<tspan fill="#ea580c">_</tspan>HUD
    </text>

    <!-- Target Intercept Box Frame around Text -->
    <path d="M -230 -25 L -250 -25 L -250 35 L -230 35" fill="none" stroke="#f97316" stroke-width="2" filter="url(#hudGlow)" />
    <path d="M 230 -25 L 250 -25 L 250 35 L 230 35" fill="none" stroke="#f97316" stroke-width="2" filter="url(#hudGlow)" />
  </g>

  <!-- Tagline / System Designation -->
  <text x="600" y="255" fill="#94a3b8" class="mono" font-size="12" font-weight="600" letter-spacing="5" text-anchor="middle">
    TACTICAL PROJECTION CONTRACT • SVELTE UI GRAMMAR
  </text>

  <!-- Bottom Weapon Station / Station Status Bar -->
  <line x1="50" y1="295" x2="1150" y2="295" stroke="#1e293b" stroke-width="1" />

  <g class="mono" font-size="10" letter-spacing="1.5">
    <text x="50" y="320" fill="#475569">PROFILE: OPERATOR-PILOT // R1-CONTRACT</text>
    <text x="600" y="320" fill="#38bdf8" text-anchor="middle" opacity="0.9">STA 1-4: [AIM-54 PHOENIX // ARMED] • EVIDENCE: PERSISTENT</text>
    <text x="1150" y="320" fill="#f97316" text-anchor="end">EMERGENCY_HALT: STANDBY</text>
  </g>
</svg>
